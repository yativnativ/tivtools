name: Deploy tools-site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site (Subdomain-Root + /tools-Fassung fuer this-is-vegan.com/tools/)
        run: |
          TIV_TOOLS_BASE_URL=https://this-is-vegan.com TIV_TOOLS_PREFIX=/tools python3 build.py
          mv dist "$RUNNER_TEMP/tools-prefixed"
          python3 build.py
          mv "$RUNNER_TEMP/tools-prefixed" dist/tools
      - name: Add Pages files (custom domain + disable Jekyll)
        run: |
          echo "tools.this-is-vegan.com" > dist/CNAME
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
